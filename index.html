<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1f1f1f" />
  <meta name="application-name" content="spl3GEAR" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="spl3GEAR" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./asset/pwa/icon-180.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="./asset/pwa/icon-192.png" />
  <title>スプラトゥーン3 ギアシミュレーター</title>
  <link rel="stylesheet" href="./SRC/styles.css" />
</head>
<body>
  <main class="app-shell">
    <section id="gearSimulator" class="simulator" aria-label="スプラトゥーン3 ギアシミュレーター"></section>
  </main>

  <script src="./SRC/data/catalog.js"></script>
  <script src="./SRC/data/sendou-data.js"></script>
  <script src="./SRC/data/wiki-weapon-main.js"></script>
  <script src="./SRC/data/map-data.js"></script>
  <script src="./SRC/state.js"></script>
  <script src="./SRC/utils.js"></script>
  <script src="./SRC/calculations.js"></script>
  <script src="./SRC/operations.js"></script>
  <script src="./SRC/renderer.js"></script>
  <script src="./SRC/app.js"></script>
  <script>
    if ("serviceWorker" in navigator && location.protocol !== "file:") {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js").catch((error) => {
          console.warn("Service worker registration failed:", error);
        });
      });
    }
  </script>
</body>
</html>
